<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Frozen Games</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b2b46;
    font-family: "Comic Sans MS", "Trebuchet MS", Verdana, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  .cornerBtn {
    position: fixed; top: 12px; z-index: 10;
    width: 54px; height: 54px; border-radius: 50%;
    border: 3px solid #ffffff; background: rgba(255,255,255,0.25);
    color: #fff; font-size: 26px; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #muteBtn { right: 12px; }
  #homeBtn { right: 78px; }
  #nameBtn { right: 144px; font-size: 22px; }
  #setBtn  { right: 210px; font-size: 24px; }
  .cornerBtn:active { transform: scale(0.94); }

  /* Name-entry overlay (a grown-up types the player's name) */
  .overlay {
    position: fixed; inset: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center;
    background: rgba(11,43,70,0.72); touch-action: auto;
  }
  .overlay[hidden] { display: none; }
  .nameCard {
    background: #fff; border-radius: 26px; padding: 26px 24px 24px;
    width: min(86vw, 420px); text-align: center;
    box-shadow: 0 12px 44px rgba(0,0,0,0.35);
  }
  .nameTitle { color: #2b6cb0; font-size: 27px; font-weight: bold; margin-bottom: 6px; }
  .nameHint  { color: #6b7f92; font-size: 15px; margin-bottom: 16px; }
  #nameInput {
    width: 100%; box-sizing: border-box; font-family: inherit;
    font-size: 26px; text-align: center; padding: 12px 14px;
    border: 3px solid #7ec8f0; border-radius: 16px; outline: none; color: #1c3b57;
    user-select: text; -webkit-user-select: text; touch-action: auto;
  }
  #nameInput:focus { border-color: #ff3b6b; }
  .nameBtn {
    margin-top: 18px; width: 100%; font-family: inherit;
    font-size: 24px; font-weight: bold; color: #fff; background: #ff3b6b;
    border: none; border-radius: 18px; padding: 14px; cursor: pointer;
  }
  .nameBtn:active { transform: scale(0.97); }

  /* Settings panel toggle rows */
  .setCard { text-align: left; }
  .setRow {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; box-sizing: border-box; margin-top: 10px;
    font-family: inherit; font-size: 20px; font-weight: bold; color: #1c3b57;
    background: #eef6fd; border: 2px solid #cfe6f7; border-radius: 14px;
    padding: 12px 16px; cursor: pointer;
  }
  .setRow:active { transform: scale(0.98); }
  .setState {
    font-size: 16px; font-weight: bold; color: #fff; background: #bcc7d1;
    border-radius: 12px; padding: 4px 12px; min-width: 46px; text-align: center;
  }
  .setRow.on .setState { background: #3fa35a; }
  #setDone { margin-top: 18px; }

  /* On-screen touch controls — shown only on touch devices */
  .touchControls { display: none; }
  body.touch .touchControls { display: block; }
  .padBtn {
    position: fixed; bottom: 20px; z-index: 10;
    width: 88px; height: 88px; border-radius: 50%;
    border: 4px solid #ffffff; background: rgba(255,255,255,0.30);
    color: #fff; font-size: 44px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  .padBtn:active { transform: scale(0.92); background: rgba(255,255,255,0.55); }
  #leftBtn  { left: 20px; }
  #rightBtn { left: 124px; }
  #jumpBtn  { right: 24px; width: 104px; height: 104px; font-size: 50px;
              background: rgba(255,120,170,0.40); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="homeBtn" class="cornerBtn" title="Back to menu" aria-label="Back to menu">🏠</button>
<button id="muteBtn" class="cornerBtn" title="Sound on/off" aria-label="Sound on or off">🔊</button>
<button id="nameBtn" class="cornerBtn" title="Change name" aria-label="Change name">✏️</button>
<button id="setBtn" class="cornerBtn" title="Settings" aria-label="Settings">⚙️</button>

<div id="setScreen" class="overlay" hidden>
  <div class="nameCard setCard">
    <div class="nameTitle" style="text-align:center">⚙️ Settings</div>
    <button class="setRow" data-key="voice"><span>🗣️ Talking</span><span class="setState">On</span></button>
    <button class="setRow" data-key="music"><span>🎵 Music</span><span class="setState">On</span></button>
    <button class="setRow" data-key="reduceMotion"><span>🌙 Calmer motion</span><span class="setState">Off</span></button>
    <button class="setRow" data-key="bigChar"><span>🧸 Bigger hero</span><span class="setState">Off</span></button>
    <button class="setRow" data-key="slow"><span>🐢 Slower moving</span><span class="setState">Off</span></button>
    <button id="setDone" class="nameBtn">Done</button>
  </div>
</div>

<div id="nameScreen" class="overlay" hidden>
  <div class="nameCard">
    <div class="nameTitle">❄️ Who's playing? ❄️</div>
    <div class="nameHint">A grown-up can type your name.</div>
    <input id="nameInput" type="text" maxlength="12" placeholder="Type a name"
           autocomplete="off" autocapitalize="words" spellcheck="false" />
    <button id="nameGo" class="nameBtn">Let's play! ❄️</button>
  </div>
</div>

<div class="touchControls">
  <button id="leftBtn"  class="padBtn" aria-label="Move left">◀</button>
  <button id="rightBtn" class="padBtn" aria-label="Move right">▶</button>
  <button id="jumpBtn"  class="padBtn" aria-label="Jump">⬆</button>
</div>

<script>
/* =========================================================================
   Owen's Frozen Games — a gentle 2D platformer for a 4-year-old
   - Arrow keys only:  ← → move,  ↑ jump
   - Main menu to choose a story
   - Story 1: Sven's Lost Carrots   (collect carrots)
   - Story 2: Olaf's Missing Pieces (rebuild Olaf, HUD assembles him)
   - Scrolling levels, jump onto platforms to reach pieces
   - No fail state, no timer, no enemies; arrows always point to pieces
   ========================================================================= */

// ---- Player name (entered by a grown-up, remembered between visits) ------
let NAME = "Friend";
const NAME_KEY = 'owensFrozenGames.playerName';
let nameOpen = false;

const nameScreen = document.getElementById('nameScreen');
const nameInput  = document.getElementById('nameInput');
const nameGo     = document.getElementById('nameGo');
const nameBtn    = document.getElementById('nameBtn');

function sanitizeName(s) { return (s || '').replace(/\s+/g, ' ').trim().slice(0, 12); }
function applyName(n) { NAME = n || 'Friend'; document.title = NAME + "'s Frozen Games"; }

function openNameScreen() {
  nameOpen = true;
  nameInput.value = (NAME && NAME !== 'Friend') ? NAME : '';
  nameScreen.hidden = false;
  setTimeout(() => { nameInput.focus(); nameInput.select(); }, 50);
}
function saveNameScreen() {
  applyName(sanitizeName(nameInput.value));
  try { localStorage.setItem(NAME_KEY, NAME); } catch (e) {}
  nameScreen.hidden = true; nameOpen = false; initAudio();
}

nameGo.addEventListener('click', saveNameScreen);
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveNameScreen(); } });
nameBtn.addEventListener('click', openNameScreen);

// On load: use the remembered name, or ask for one the first time.
(function initName() {
  let saved = null;
  try { saved = localStorage.getItem(NAME_KEY); } catch (e) {}
  if (saved && saved.trim()) applyName(sanitizeName(saved));
  else openNameScreen();
})();

// ---- Virtual world (drawn at this size, scaled to fit the window) --------
const W = 960, H = 600;
const GROUND = 500;                 // y of the ground surface (feet stand here)
const GRAVITY = 2200, JUMP = 900, MOVE = 340, FOOT = 68;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scale = 1, offX = 0, offY = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.floor(cw * DPR);
  canvas.height = Math.floor(ch * DPR);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = Math.min(cw / W, ch / H);
  offX = (cw - W * scale) / 2;
  offY = (ch - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// ---- Sound (WebAudio, no files) ------------------------------------------
let audioCtx = null, muted = false;
function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx=null; } }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, start, dur, type, vol) {
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + start;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfxStep()    { tone(170, 0, 0.06, 'triangle', 0.05); }
function sfxJump()    { tone(320,0,0.09,'square',0.10); tone(520,0.06,0.1,'square',0.10); }
function sfxCollect() { tone(523,0,0.13,'sine',0.25); tone(659,0.1,0.13,'sine',0.25); tone(784,0.2,0.2,'sine',0.28); tone(1046,0.32,0.28,'sine',0.24); }
function sfxTick()    { tone(600,0,0.05,'sine',0.12); }
function sfxSwitch()  { tone(392,0,0.14,'sine',0.2); tone(587,0.09,0.18,'sine',0.2); }
function sfxWin()     { [523,659,784,1046,784,1046,1318].forEach((f,i)=>{ tone(f,i*0.16,0.28,'sine',0.24); tone(f/2,i*0.16,0.28,'triangle',0.1); }); }

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; initAudio(); });

const homeBtn = document.getElementById('homeBtn');
homeBtn.addEventListener('click', () => { state = 'menu'; keys.ArrowLeft=keys.ArrowRight=keys.ArrowUp=keys.ArrowDown=false; });

// ---- Settings (remembered), narration & background music -----------------
const SET_KEY = 'owensFrozenGames.settings';
const prefersReduce = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
let settings = { voice:true, music:true, reduceMotion:prefersReduce, bigChar:false, slow:false };
(function loadSettings(){ try { const s = JSON.parse(localStorage.getItem(SET_KEY)); if (s && typeof s === 'object') settings = Object.assign(settings, s); } catch(e){} })();
function saveSettings(){ try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch(e){} }
function RM(){ return settings.reduceMotion; }

// Spoken narration (Web Speech API, no files). Cancels itself so lines don't stack.
let voices = [];
function loadVoices(){ try { voices = window.speechSynthesis.getVoices() || []; } catch(e){ voices = []; } }
if ('speechSynthesis' in window) { loadVoices(); try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch(e){} }
function say(text){
  if (!settings.voice || muted || !text) return;
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 1.15; u.volume = 0.9;
    const v = voices.find(v => /en[-_](US|GB)/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch(e){}
}
const NUMWORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function numWord(n){ return NUMWORDS[n] || String(n); }

// Gentle looping music — soft triangle notes scheduled a beat at a time.
let musicPlaying = false, musicTimer = null, musicStep = 0;
const MELODY = [261.63,329.63,392.00,329.63, 220.00,261.63,329.63,261.63, 174.61,220.00,261.63,220.00, 196.00,246.94,293.66,392.00];
function softNote(freq, dur, vol){
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur + 0.06);
}
function musicTick(){
  if (!musicPlaying) return;
  const f = MELODY[musicStep % MELODY.length];
  softNote(f, 0.5, 0.05);
  if (musicStep % 4 === 0) softNote(f/2, 0.9, 0.04);   // gentle bass
  musicStep++;
  musicTimer = setTimeout(musicTick, 430);
}
function startMusic(){ if (musicPlaying) return; musicPlaying = true; musicStep = 0; musicTick(); }
function stopMusic(){ musicPlaying = false; if (musicTimer){ clearTimeout(musicTimer); musicTimer = null; } }

function sfxHi(){ tone(880,0,0.10,'sine',0.12); tone(1174,0.08,0.13,'sine',0.12); }   // friendly critter chime

// ---- Settings panel wiring ----------------------------------------------
let setOpen = false;
const setScreen = document.getElementById('setScreen');
const setBtn = document.getElementById('setBtn');
function refreshSetRow(btn){ const on = !!settings[btn.dataset.key]; btn.classList.toggle('on', on); btn.querySelector('.setState').textContent = on ? 'On' : 'Off'; }
function openSettings(){ setOpen = true; document.querySelectorAll('.setRow').forEach(refreshSetRow); setScreen.hidden = false; initAudio(); }
function closeSettings(){ setOpen = false; setScreen.hidden = true; saveSettings(); }
setBtn.addEventListener('click', openSettings);
document.getElementById('setDone').addEventListener('click', closeSettings);
document.querySelectorAll('.setRow').forEach(btn => {
  btn.addEventListener('click', () => {
    const k = btn.dataset.key; settings[k] = !settings[k]; refreshSetRow(btn); saveSettings();
    if (k === 'voice' && !settings.voice) { try { window.speechSynthesis.cancel(); } catch(e){} }
  });
});

// ---- Input: arrows only --------------------------------------------------
const keys = {};
const ARROWS = { ArrowUp:1, ArrowDown:1, ArrowLeft:1, ArrowRight:1 };
window.addEventListener('keydown', (e) => {
  if (!ARROWS[e.key]) return;
  if (nameOpen || setOpen) return;      // let overlays keep focus
  e.preventDefault(); keys[e.key] = true; initAudio();
  if (!e.repeat) onPress(e.key);
});
window.addEventListener('keyup', (e) => { if (ARROWS[e.key]) keys[e.key] = false; });

// ---- Touch controls: map on-screen buttons to the same arrow logic -------
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');

function bindHold(el, key) {
  const down = (e) => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    keys[key] = true; initAudio(); onPress(key);
  };
  const up = (e) => { e.preventDefault(); keys[key] = false; };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}
bindHold(document.getElementById('leftBtn'),  'ArrowLeft');
bindHold(document.getElementById('rightBtn'), 'ArrowRight');
bindHold(document.getElementById('jumpBtn'),  'ArrowUp');

function onPress(key) {
  if (nameOpen || setOpen) return;
  if (state === 'menu') {
    if (key === 'ArrowLeft')  { menuIndex = (menuIndex + STORIES.length - 1) % STORIES.length; sfxTick(); }
    if (key === 'ArrowRight') { menuIndex = (menuIndex + 1) % STORIES.length; sfxTick(); }
    if (key === 'ArrowUp')    { startStory(menuIndex); }
  } else if (state === 'choose') {
    if (key === 'ArrowLeft')  { charIndex = (charIndex + CHARS.length - 1) % CHARS.length; sfxTick(); }
    if (key === 'ArrowRight') { charIndex = (charIndex + 1) % CHARS.length; sfxTick(); }
    if (key === 'ArrowDown')  { hatIndex = (hatIndex + 1) % HATS.length; sfxTick(); }
    if (key === 'ArrowUp')    { beginStory(); }
  } else if (state === 'play') {
    if (key === 'ArrowUp') player.wantJump = true;
  } else if (state === 'win') {
    if (key === 'ArrowUp') { state = 'menu'; }
  }
}

// Tap directly on a story / character / hat card, a bubble or a mound.
let menuHits = [], chooseHits = [], hatHits = [];
function inRect(px, py, r){ return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }
canvas.addEventListener('pointerdown', (e) => {
  if (nameOpen || setOpen) return;
  initAudio();
  const vx = (e.clientX - offX) / scale, vy = (e.clientY - offY) / scale;
  if (state === 'menu') {
    for (const h of menuHits) if (inRect(vx, vy, h)) { menuIndex = h.i; startStory(h.i); return; }
  } else if (state === 'choose') {
    for (const h of hatHits)    if (inRect(vx, vy, h)) { hatIndex = h.i; sfxTick(); return; }
    for (const h of chooseHits) if (inRect(vx, vy, h)) { charIndex = h.i; beginStory(); return; }
  } else if (state === 'play') {
    const wx = vx + cameraX, wy = vy;          // world coordinates
    for (let i=area.bubbles.length-1;i>=0;i--){ const b=area.bubbles[i]; if (Math.hypot(wx-b.x, wy-b.y) < b.r+12){ popBubble(b); area.bubbles.splice(i,1); return; } }
    for (const pk of area.pokes) if (Math.abs(wx-pk.x) < 46 && wy > GROUND-90 && (pk.cool||0) <= 0) { revealPoke(pk); return; }
  } else if (state === 'win') {
    state = 'menu';
  }
});

// =========================================================================
//  STORY / LEVEL DATA
// =========================================================================
// Four floating platforms per level; pieces sit just above a platform so a
// jump lands you on the platform and collects the piece — forgiving on aim.
function buildArea(title, who, drawKind, theme, itemTypes, variant) {
  const worldW = 2500;
  const platforms = [
    { x: 520,  y: 400, w: 160 },
    { x: 1000, y: 350, w: 180 },
    { x: 1520, y: 405, w: 160 },
    { x: 1980, y: 360, w: 170 },
  ];
  const spots = [
    { x: 600,  y: 350 },
    { x: 1090, y: 300 },
    { x: 1600, y: 355 },
    { x: 2065, y: 310 },
  ];
  let chosen;
  if (itemTypes.length === 1) chosen = [spots[1]];
  else if (itemTypes.length === 2) chosen = [spots[0], spots[2]];
  else chosen = spots.slice(0, itemTypes.length);
  const items = itemTypes.map((t, i) => ({ x: chosen[i].x, y: chosen[i].y, type: t, got: false, wob: i }));
  const friend = { x: 1300, cool: 0, hop: 0 };   // a snow-bunny to say hello to
  return { title, who, draw: drawKind, theme, variant: variant || 0, worldW, platforms, items, friend, flagX: worldW - 150 };
}

const STORIES = [
  {
    id: 'carrots', title: "Sven's Lost Carrots", emoji: "🥕",
    sub: "Find Sven's carrots in Elsa's ice castle!",
    find: "Find the carrots!",
    winTitle: "You found all of Sven's carrots!",
    winLine: "Sven says thank you! 🦌🥕",
    areas: [
      buildArea("Great Ice Hall",       "Anna",     "anna",     "icecastle", ["carrot","carrot"], 0),
      buildArea("Frozen Grand Stair",   "Elsa",     "elsa",     "icecastle", ["carrot"],          1),
      buildArea("Crystal Ballroom",     "Kristoff", "kristoff", "icecastle", ["carrot","carrot"], 2),
      buildArea("Snowflake Throne Room","Sven",     "sven",     "icecastle", ["carrot"],          3),
    ],
  },
  {
    id: 'olaf', title: "Olaf's Missing Pieces", emoji: "⛄",
    sub: "Gale blew Olaf apart! Find his pieces!",
    find: "Find Olaf's pieces!",
    winTitle: "You put Olaf back together!",
    winLine: "Olaf says: I like warm hugs! ⛄",
    areas: [
      buildArea("Castle Garden",  "Anna",     "anna",     "garden",   ["nose"]),
      buildArea("Frozen Lake",    "Elsa",     "elsa",     "lake",     ["arm"]),
      buildArea("North Mountain", "Kristoff", "kristoff", "mountain", ["arm"]),
      buildArea("Snowy Woods",    "Sven",     "sven",     "woods",    ["buttons","hair"]),
    ],
  },
  {
    id: 'snowgies', title: "Little Snowgies", emoji: "⛄",
    sub: "Olaf's tiny snowgies are hiding!",
    find: "Find the snowgies!",
    winTitle: "You found all the snowgies!",
    winLine: "The snowgies giggle with joy! ⛄✨",
    areas: [
      buildArea("Castle Garden",  "Anna",     "anna",     "garden",   ["snowgie","snowgie"]),
      buildArea("Frozen Lake",    "Elsa",     "elsa",     "lake",     ["snowgie"]),
      buildArea("North Mountain", "Kristoff", "kristoff", "mountain", ["snowgie","snowgie"]),
      buildArea("Snowy Woods",    "Sven",     "sven",     "woods",    ["snowgie"]),
    ],
  },
];

// Characters the player can choose to be (last option keeps the classic
// per-room switching where you become whoever lives in that room).
const CHARS = [
  { key:'anna',     name:'Anna' },
  { key:'elsa',     name:'Elsa' },
  { key:'kristoff', name:'Kristoff' },
  { key:'sven',     name:'Sven' },
  { key:'everyone', name:'Everyone!' },
];
function charName(key){ const c = CHARS.find(c => c.key === key); return c ? c.name : key; }

// ---- Engagement extras: hats, buddy, golden stars, world skins -----------
const HAT_KEY = 'owensFrozenGames.hat';
const STARS_KEY = 'owensFrozenGames.stars';
let playHat = 'none', hatIndex = 0;
(function loadHat(){ try { const h = localStorage.getItem(HAT_KEY); if (h) playHat = h; } catch(e){} })();
let starTotal = 0;
(function loadStars(){ try { starTotal = parseInt(localStorage.getItem(STARS_KEY) || '0', 10) || 0; } catch(e){} })();
function addStar(){ starTotal++; try { localStorage.setItem(STARS_KEY, String(starTotal)); } catch(e){} }
let timeOfDay = 'day';                 // day | sunset | night (chosen each play)
let goldRun = 0;                       // golden stars found this playthrough
let comboCount = 0, lastCollectMs = 0; // rising-cheer combo
let buddy = null;                      // the little follower

// =========================================================================
//  GAME STATE
// =========================================================================
let state = 'menu';         // menu | choose | play | switching | win
let menuIndex = 0, charIndex = 0, playChar = 'everyone';
let story = null, area = null, areaIndex = 0;
let totalItems = 0, collected = 0, parts = {};
let cameraX = 0, stateTime = 0, lastT = 0;
let areaCleared = false, clearTimer = 0;

const player = { x: 120, y: GROUND, vy: 0, dir: 1, onGround: true, moving: false, bob: 0, wantJump: false };
let sparkles = [], popups = [], confetti = [];

function currentArea() { return story.areas[areaIndex]; }
// The character actually being played in the current room (respects the pick).
function areaDraw(){ return (playChar && playChar !== 'everyone') ? playChar : area.draw; }
function areaWho(){  return (playChar && playChar !== 'everyone') ? charName(playChar) : area.who; }

function startStory(idx) {
  story = STORIES[idx];
  story.areas.forEach(a => a.items.forEach(it => it.got = false));
  totalItems = story.areas.reduce((n,a)=> n + a.items.length, 0);
  collected = 0; parts = {};
  areaIndex = 0; charIndex = 0;
  goldRun = 0; comboCount = 0; lastCollectMs = 0;
  timeOfDay = ['day','day','sunset','night'][Math.floor(Math.random()*4)];   // a world that changes
  hatIndex = Math.max(0, HATS.findIndex(h => h.key === playHat));
  state = 'choose'; stateTime = 0;
  sfxTick(); say("Who do you want to be?");
}
function beginStory() {
  playChar = CHARS[charIndex].key;
  playHat = HATS[hatIndex].key; try { localStorage.setItem(HAT_KEY, playHat); } catch(e){}
  loadArea();
  sfxSwitch();
  state = 'switching'; stateTime = 0;
  announceArea();
}
function announceArea() {
  const who = areaWho();
  const lead = (playChar === 'everyone') ? ("Now you are " + who + "! ") : "";
  say(lead + story.find);
}
function advanceArea() {
  if (areaIndex < story.areas.length - 1) { areaIndex++; loadArea(); sfxSwitch(); state = 'switching'; stateTime = 0; announceArea(); }
  else winGame();
}
function loadArea() {
  area = currentArea();
  relayoutArea(area);                 // surprise layout + fresh interactive objects
  player.x = 110; player.y = GROUND; player.vy = 0; player.onGround = true; player.dir = 1; player.wantJump = false;
  cameraX = 0; sparkles = []; popups = [];
  areaCleared = false; clearTimer = 0;
  if (area.friend) { area.friend.cool = 0; area.friend.hop = 0; }
  initBuddy();
}
function areaItemsLeft() { return area.items.some(it => !it.got); }

// =========================================================================
//  UPDATE
// =========================================================================
function update(dt) {
  stateTime += dt;

  if (state === 'switching') { if (stateTime > 1.8) { state = 'play'; stateTime = 0; } }
  else if (state === 'play') updatePlay(dt);
  else if (state === 'win') {
    confetti.forEach(p => { p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt; if (p.y > H+20){ p.y=-20; p.x=Math.random()*W; } });
  }

  // sparkles, hearts & popups
  for (let i = sparkles.length-1; i>=0; i--){
    const s = sparkles[i]; s.life -= dt;
    if (s.kind === 'burst') { s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 300*dt; }
    else if (s.kind === 'heart') { s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 26*dt; }
    else if (s.kind === 'puff') { s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 40*dt; }
    if (s.life <= 0) sparkles.splice(i,1);
  }
  for (let i = popups.length-1; i>=0; i--){ const p=popups[i]; p.life-=dt; p.y-=40*dt; if(p.life<=0) popups.splice(i,1); }

  // Background music follows the play states and the mute / music settings.
  const wantMusic = settings.music && !muted && (state === 'play' || state === 'switching' || state === 'choose');
  if (wantMusic && !musicPlaying) startMusic();
  else if (!wantMusic && musicPlaying) stopMusic();
}

function updatePlay(dt) {
  // horizontal
  let dx = 0;
  if (keys.ArrowLeft) dx -= 1;
  if (keys.ArrowRight) dx += 1;
  player.moving = dx !== 0;
  if (dx !== 0) player.dir = dx > 0 ? 1 : -1;
  const curMove = MOVE * (settings.slow ? 0.62 : 1);
  player.x += dx * curMove * dt;
  player.x = Math.max(40, Math.min(area.worldW - 40, player.x));
  if (player.moving && player.onGround) { player.bob += dt*10; if (Math.random()<0.06) sfxStep(); }

  // jump
  if (player.wantJump && player.onGround) { player.vy = -JUMP; player.onGround = false; sfxJump(); if (buddy) buddy.hopT = 0.5; }
  player.wantJump = false;

  // gravity + vertical
  const prevFeet = player.y;
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;

  // land on platforms (one-way, from above)
  player.onGround = false;
  if (player.vy >= 0) {
    for (const p of area.platforms) {
      if (player.x > p.x - 10 && player.x < p.x + p.w + 10 && prevFeet <= p.y + 2 && player.y >= p.y) {
        player.y = p.y; player.vy = 0; player.onGround = true; break;
      }
    }
  }
  // ground (with springy bounce pad)
  if (player.y >= GROUND) {
    const landV = player.vy;
    player.y = GROUND; player.vy = 0; player.onGround = true;
    const bp = area.bounce;
    if (bp && Math.abs(player.x - bp.x) < 42 && landV > 250) {
      player.vy = -JUMP * 1.4; player.onGround = false; bp.t = 0.35; sfxBoing();
      if (buddy) buddy.hopT = 0.5;
    }
  }

  // Elsa sparkle trail (calmer when reduced-motion is on)
  if (areaDraw() === 'elsa' && (player.moving || !player.onGround) && Math.random() < (RM() ? 0.25 : 0.6))
    sparkles.push({ x: player.x + (Math.random()*24-12), y: player.y - 30, life: 0.7, max: 0.7, kind:'trail' });

  // collect
  const cy = player.y - 40;
  for (const it of area.items) {
    it.wob += dt * 3;
    if (it.got) continue;
    if (Math.hypot(player.x - it.x, cy - it.y) < 60) {
      it.got = true; collected++;
      parts[it.type] = (parts[it.type] || 0) + 1;
      // rising-cheer combo: quick successive collects climb a happy scale
      const nowMs = performance.now();
      comboCount = (nowMs - lastCollectMs < 1500) ? comboCount + 1 : 1;
      lastCollectMs = nowMs;
      sfxCollect(); sfxCombo(comboCount - 1);
      if (buddy) buddy.cheer = 0.6;
      say(numWord(collected));                                   // count out loud
      popups.push({ x: it.x, y: it.y - 20, life: 1.2, type: it.type, count: collected });
      const burst = (RM() ? 8 : 22) + Math.min(comboCount * 4, 20);
      for (let i=0;i<burst;i++){ const a=Math.random()*Math.PI*2, sp=60+Math.random()*150; sparkles.push({x:it.x,y:it.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,max:1,kind:'burst'}); }
    }
  }

  // golden bonus star (surprise — not required, extra sparkle & jingle)
  const bn = area.bonus;
  if (bn && !bn.got) {
    bn.wob += dt * 3;
    if (Math.hypot(player.x - bn.x, cy - bn.y) < 62) {
      bn.got = true; goldRun++; addStar(); sfxGold(); say("Wow! A golden star!");
      if (buddy) buddy.cheer = 0.6;
      popups.push({ x: bn.x, y: bn.y - 20, life: 1.3, type: 'golden' });
      const ng = RM() ? 12 : 30;
      for (let i=0;i<ng;i++){ const a=Math.random()*Math.PI*2, sp=80+Math.random()*180; sparkles.push({x:bn.x,y:bn.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.2,max:1.2,kind:'burst'}); }
    }
  }

  // friendly snow-bunny: hops, pops hearts and chimes when you come near
  const f = area.friend;
  if (f) {
    f.hop = Math.max(0, f.hop - dt);
    f.cool = Math.max(0, f.cool - dt);
    if (Math.abs(player.x - f.x) < 72 && f.cool <= 0) {
      f.cool = 1.6; f.hop = 0.6; sfxHi();
      const nh = RM() ? 3 : 6;
      for (let i=0;i<nh;i++) sparkles.push({ x: f.x + (Math.random()*30-15), y: GROUND-60, vx: (Math.random()*40-20), vy: -40-Math.random()*40, life: 1.1, max: 1.1, kind:'heart' });
    }
  }

  // buddy follows a step behind and mirrors your hops
  if (buddy) {
    buddy.x += (player.x - player.dir*48 - buddy.x) * Math.min(1, dt*5);
    buddy.hopT  = Math.max(0, buddy.hopT - dt);
    buddy.cheer = Math.max(0, buddy.cheer - dt);
  }

  // bounce-pad squash timer
  if (area.bounce) area.bounce.t = Math.max(0, area.bounce.t - dt);

  // poke-the-scenery mounds: a snowgie peeks out when you bump them
  for (const pk of area.pokes) {
    pk.rev = Math.max(0, pk.rev - dt);
    pk.cool = Math.max(0, (pk.cool || 0) - dt);
    if (Math.abs(player.x - pk.x) < 38 && pk.cool <= 0) revealPoke(pk);
  }

  // floating bubbles: drift up, pop when you bump them
  area.bubbleT -= dt;
  if (area.bubbleT <= 0 && area.bubbles.length < (RM() ? 3 : 7)) {
    area.bubbleT = 0.8 + Math.random()*1.2;
    area.bubbles.push({ x: cameraX + Math.random()*W, y: H + 20, vy: -30 - Math.random()*30, r: 10 + Math.random()*12, wob: Math.random()*7 });
  }
  for (let i=area.bubbles.length-1;i>=0;i--){
    const b = area.bubbles[i]; b.y += b.vy*dt; b.wob += dt*2;
    if (b.y < -30) { area.bubbles.splice(i,1); continue; }
    if (Math.hypot(player.x - b.x, (player.y-40) - b.y) < b.r + 22) { popBubble(b); area.bubbles.splice(i,1); }
  }

  // Area cleared → celebrate once, then advance when they reach the flag
  // (or automatically after a short beat, so no one gets stuck).
  if (!areaItemsLeft()) {
    if (!areaCleared) { areaCleared = true; clearTimer = 0; say("You found them all!"); }
    clearTimer += dt;
    const atFlag = player.onGround && Math.abs(player.x - area.flagX) < 55;
    if (atFlag || clearTimer > 3.0) advanceArea();
  }

  // camera follows player
  cameraX = Math.max(0, Math.min(area.worldW - W, player.x - W/2));
}

function winGame() {
  confetti = [];
  const n = RM() ? 45 : 150, vscale = RM() ? 0.6 : 1;
  for (let i=0;i<n;i++) confetti.push({ x:Math.random()*W, y:-Math.random()*H, vy:(60+Math.random()*130)*vscale, vx:Math.random()*40-20, rot:Math.random()*Math.PI, vr:Math.random()*6-3, c:['#ff6b9d','#7ed0ff','#ffd93b','#8affc1','#c8a2ff','#fff'][Math.floor(Math.random()*6)], s:8+Math.random()*8 });
  sfxWin(); state='win'; stateTime=0;
  say("Great job, " + NAME + "! " + story.winTitle);
}

// =========================================================================
//  DRAW
// =========================================================================
function draw() {
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#0b2b46'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();

  if (state === 'menu') drawMenu();
  else if (state === 'choose') drawChoose();
  else if (state === 'win') drawWin();
  else {
    drawSky(area.theme);
    skyOverlay();                        // day / sunset / night skin
    ctx.save(); ctx.translate(-cameraX, 0);
      drawGroundWorld(area);
      if (area.bounce) drawBounce(area.bounce);
      area.pokes.forEach(drawMound);
      area.platforms.forEach(p => drawPlatform(p, area.theme));
      if (area.friend) drawBunny(area.friend.x, GROUND, area.friend.hop);
      if (area.bonus && !area.bonus.got) drawGolden(area.bonus);
      area.items.forEach(it => { if (!it.got) { drawItem(it.type, it.x, it.y, it.wob, false); drawHintArrow(it.x, it.y, it.wob); } });
      drawFlag(area.flagX, !areaItemsLeft(), story.emoji);
      drawSparklesWorld('trail');
      drawBuddy();
      drawCharacter(areaDraw(), player.x, player.y, player.moving && player.onGround ? player.bob : 0, !player.onGround);
      area.bubbles.forEach(drawBubble);
      drawSparklesWorld('burst');
      drawPuffWorld();
      drawHeartsWorld();
      popups.forEach(p => drawPopup(p));
    ctx.restore();
    drawHUD();
    if (state === 'switching') drawSwitchBanner();
  }
  ctx.restore();
}

// ---- Sky (screen space) --------------------------------------------------
function skyGrad(c1,c2){ const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,c1); g.addColorStop(1,c2); return g; }
function drawSky(theme) {
  if (theme==='garden'){ ctx.fillStyle=skyGrad('#bfe9ff','#eafff2'); ctx.fillRect(0,0,W,H); drawSun(120,110); cloud(500,120); cloud(760,90); }
  else if (theme==='lake'){ ctx.fillStyle=skyGrad('#8fbfe6','#d7f0ff'); ctx.fillRect(0,0,W,H); ctx.fillStyle='#b9d6ea'; farMtn(250,430,300,220); farMtn(650,430,340,250); snow(); }
  else if (theme==='mountain'){ ctx.fillStyle=skyGrad('#a9c7e8','#e9f4ff'); ctx.fillRect(0,0,W,H); ctx.fillStyle='#cfe0f0'; farMtn(260,470,420,340); farMtn(700,470,440,360); ctx.fillStyle='#fff'; peak(260,150,90); peak(700,120,100); snow(); }
  else if (theme==='icecastle'){ ctx.fillStyle=skyGrad('#6f8fce','#d6e9ff'); ctx.fillRect(0,0,W,H); iceHall(); snow(); }
  else { ctx.fillStyle=skyGrad('#7fa8d8','#cfe6ff'); ctx.fillRect(0,0,W,H); snow(); }
}

// ---- Elsa's ice castle interior (far background, screen space) -----------
function iceHall() {
  // cool wall wash behind everything
  ctx.fillStyle = 'rgba(150,190,228,0.30)'; ctx.fillRect(0, 0, W, GROUND);
  // tall pointed ice windows between the pillars
  for (let x = 200; x < W; x += 210) iceWindow(x, 320, 118, 200);
  // ice pillars across the back
  for (let x = 100; x < W + 40; x += 210) iceBackPillar(x, 30, GROUND, 15);
  // a hanging ice chandelier
  iceChandelier(W/2, 18);
}
function iceWindow(x, baseY, w, h) {
  const half = w/2;
  ctx.fillStyle = 'rgba(206,232,255,0.80)';
  ctx.beginPath();
  ctx.moveTo(x-half, baseY);
  ctx.lineTo(x-half, baseY-h*0.6);
  ctx.lineTo(x, baseY-h);
  ctx.lineTo(x+half, baseY-h*0.6);
  ctx.lineTo(x+half, baseY);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 4; ctx.stroke();
  ctx.strokeStyle = 'rgba(140,175,215,0.6)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, baseY); ctx.lineTo(x, baseY-h*0.85);
  ctx.moveTo(x-half, baseY-h*0.32); ctx.lineTo(x+half, baseY-h*0.32);
  ctx.stroke();
}
function iceBackPillar(x, topY, botY, w) {
  const g = ctx.createLinearGradient(x-w, 0, x+w, 0);
  g.addColorStop(0, 'rgba(160,200,235,0.85)');
  g.addColorStop(0.5, 'rgba(232,246,255,0.92)');
  g.addColorStop(1, 'rgba(160,200,235,0.85)');
  ctx.fillStyle = g; ctx.fillRect(x-w, topY, w*2, botY-topY);
  ctx.fillStyle = 'rgba(214,238,255,0.95)';
  ctx.fillRect(x-w-5, topY, w*2+10, 12);
}
function iceChandelier(x, y) {
  ctx.strokeStyle = 'rgba(200,230,255,0.7)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, y+12); ctx.stroke();
  ctx.fillStyle = 'rgba(222,242,255,0.9)';
  ctx.beginPath(); ctx.ellipse(x, y+14, 86, 10, 0, 0, 7); ctx.fill();
  for (let i=-3; i<=3; i++){ const px=x+i*24; ctx.beginPath(); ctx.moveTo(px-6,y+16); ctx.lineTo(px+6,y+16); ctx.lineTo(px,y+42); ctx.closePath(); ctx.fill(); glow(px, y+42, 9, true); }
}
function drawSun(x,y){ ctx.fillStyle='#ffe27a'; ctx.beginPath(); ctx.arc(x,y,34,0,7); ctx.fill(); ctx.strokeStyle='#ffe27a'; ctx.lineWidth=5; for(let i=0;i<8;i++){const a=i/8*6.283; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*40,y+Math.sin(a)*40); ctx.lineTo(x+Math.cos(a)*54,y+Math.sin(a)*54); ctx.stroke();} }
function cloud(x,y){ ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(x,y,22,0,7); ctx.arc(x+24,y+4,18,0,7); ctx.arc(x-22,y+6,16,0,7); ctx.fill(); }
function farMtn(cx,baseY,w,h){ ctx.beginPath(); ctx.moveTo(cx-w/2,baseY); ctx.lineTo(cx,baseY-h); ctx.lineTo(cx+w/2,baseY); ctx.closePath(); ctx.fill(); }
function peak(cx,topY,w){ ctx.beginPath(); ctx.moveTo(cx-w/2,topY+w*0.7); ctx.lineTo(cx,topY); ctx.lineTo(cx+w/2,topY+w*0.7); ctx.closePath(); ctx.fill(); }
let snowFlakes=null;
function snow(){ if(!snowFlakes){ snowFlakes=[]; for(let i=0;i<55;i++) snowFlakes.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,s:15+Math.random()*30}); } ctx.fillStyle='rgba(255,255,255,0.9)'; const t=performance.now()/1000; const count=RM()?16:55, speed=RM()?0.35:1, sway=RM()?0:8; for(let i=0;i<count;i++){ const f=snowFlakes[i]; const yy=(f.y+t*f.s*speed)%H, xx=f.x+Math.sin((yy+f.x)/40)*sway; ctx.beginPath(); ctx.arc(xx,yy,f.r,0,7); ctx.fill(); } }

// ---- Ground + decorations (world space) ----------------------------------
function drawGroundWorld(a) {
  const ww = a.worldW;
  let gc = '#a6e2a1';
  if (a.theme==='lake') gc='#cdeefc';
  else if (a.theme==='icecastle') gc='#cbe6fb';
  else if (a.theme==='mountain'||a.theme==='woods') gc='#eaf3fb';
  ctx.fillStyle = gc; ctx.fillRect(0, GROUND, ww, H-GROUND);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(0, GROUND, ww, 5);

  if (a.theme==='garden') {
    ctx.fillStyle='#8fd68a'; for(let x=30;x<ww;x+=110) roundBush(x,GROUND,44);
    for(let i=0,x=90;x<ww;x+=140,i++) drawFlower(x,GROUND+40+(i%2)*22,['#ff8fb1','#ffd93b','#c8a2ff'][i%3]);
    drawCastle(ww-360, 150);
  } else if (a.theme==='lake') {
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=3;
    for(let x=80;x<ww;x+=160){ ctx.beginPath(); ctx.moveTo(x,GROUND+6); ctx.lineTo(x+60,H); ctx.stroke(); }
    drawSnowman(180, GROUND-14, false);
  } else if (a.theme==='icecastle') {
    // glossy reflections streaking down the ice floor
    ctx.strokeStyle='rgba(255,255,255,0.40)'; ctx.lineWidth=2;
    for(let x=40;x<ww;x+=90){ ctx.beginPath(); ctx.moveTo(x,GROUND+8); ctx.lineTo(x-26,H); ctx.stroke(); }
    // a frosted runner down the middle of the hall
    ctx.fillStyle='rgba(120,180,225,0.20)'; ctx.fillRect(0,GROUND+46,ww,22);
    // tall ice columns lining the room
    for(let x=150;x<ww-120;x+=360) drawIcePillar(x, GROUND);
    // the throne room gets Elsa's ice throne at the end
    if (a.variant===3) drawIceThrone(ww-360, GROUND);
  } else if (a.theme==='mountain') {
    for(let x=70;x<ww;x+=190) drawPine(x, GROUND, 64);
  } else {
    for(let x=60;x<ww;x+=150) drawPine(x, GROUND, 78 + ((x/150)%3)*16);
  }
}
function roundBush(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,Math.PI,0); ctx.fill(); }
function drawFlower(x,y,c){ ctx.fillStyle='#3fa35a'; ctx.fillRect(x-2,y,4,24); ctx.fillStyle=c; for(let i=0;i<5;i++){const a=i/5*6.283; ctx.beginPath(); ctx.arc(x+Math.cos(a)*8,y+Math.sin(a)*8,6,0,7); ctx.fill();} ctx.fillStyle='#ffd93b'; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill(); }
function drawPine(x,groundY,h){ ctx.fillStyle='#5b3a1e'; ctx.fillRect(x-6,groundY-14,12,20); ctx.fillStyle='#2f8f57'; for(let i=0;i<3;i++){const yy=groundY-10-i*h*0.28, ww=h*0.5*(1-i*0.22); ctx.beginPath(); ctx.moveTo(x-ww,yy); ctx.lineTo(x,yy-h*0.42); ctx.lineTo(x+ww,yy); ctx.closePath(); ctx.fill();} ctx.fillStyle='rgba(255,255,255,0.85)'; for(let i=0;i<3;i++){const yy=groundY-10-i*h*0.28, ww=h*0.5*(1-i*0.22); ctx.beginPath(); ctx.moveTo(x-ww,yy); ctx.lineTo(x,yy-h*0.14); ctx.lineTo(x+ww*0.5,yy-2); ctx.closePath(); ctx.fill();} }
function drawCastle(x,y){ ctx.fillStyle='#7fa9c9'; ctx.fillRect(x-90,y+40,180,GROUND-(y+40)); ctx.fillStyle='#6b93b3'; ctx.fillRect(x-120,y+80,40,GROUND-(y+80)); ctx.fillRect(x+80,y+80,40,GROUND-(y+80)); ctx.fillStyle='#6f7fd6'; peak(x-100,y+30,60); peak(x+100,y+30,60); peak(x,y-10,80); ctx.fillStyle='#9fd4ff'; ctx.fillRect(x-18,y+150,36,60); }

// Foreground ice column standing on the castle floor
function drawIcePillar(x, groundY){
  const topY = 150, w = 24;
  const g = ctx.createLinearGradient(x-w, 0, x+w, 0);
  g.addColorStop(0, 'rgba(150,195,230,0.75)');
  g.addColorStop(0.5, 'rgba(234,247,255,0.88)');
  g.addColorStop(1, 'rgba(150,195,230,0.75)');
  ctx.fillStyle = g; ctx.fillRect(x-w, topY, w*2, groundY-topY);
  ctx.fillStyle = 'rgba(212,238,255,0.95)';
  ctx.fillRect(x-w-6, groundY-14, w*2+12, 14);   // base
  ctx.fillRect(x-w-6, topY, w*2+12, 14);         // capital
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillRect(x-w+5, topY+16, 5, groundY-topY-30); // shine
}
// Elsa's ice throne (throne-room finale)
function drawIceThrone(x, groundY){
  ctx.fillStyle = 'rgba(202,231,255,0.9)';

function drawPlatform(p, theme) {
  let top='#8fd68a', side='#5aa860';
  if (theme==='lake'){ top='#bfe8fb'; side='#8fcbe8'; }
  else if (theme==='icecastle'){ top='#eaf6ff'; side='#a9d3ee'; }
  else if (theme==='mountain'||theme==='woods'){ top='#ffffff'; side='#cfe0ef'; }
  ctx.fillStyle = side; roundRect(p.x, p.y, p.w, 26, 10); ctx.fill();
  ctx.fillStyle = top;  roundRect(p.x, p.y, p.w, 12, 8); ctx.fill();
}

function drawItem(type, x, y, wob, bright) {
  const bob = Math.sin(wob)*6; y += bob;
  glow(x,y,52,bright);
  if (type==='carrot' || type==='nose') drawCarrotShape(x,y);
  else if (type==='arm') drawArm(x,y);
  else if (type==='buttons') drawButtons(x,y);
  else if (type==='hair') drawHair(x,y);
  else if (type==='snowgie') drawSnowgie(x,y);
  else if (type==='golden') drawStar(x,y,16,'#ffd23f','#ffb300');
}

// Friendly snow-bunny that hops when the hero comes near
function drawBunny(x, groundY, hop){
  const lift = hop > 0 ? Math.sin((1 - hop/0.6) * Math.PI) * 16 : 0;
  shadowAt(x, groundY+2, 18);
  ctx.save(); ctx.translate(x, groundY - 16 - lift);
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-14,4,5,0,7); ctx.fill();                 // tail
  ctx.beginPath(); ctx.ellipse(0,0,16,14,0,0,7); ctx.fill();         // body
  ctx.beginPath(); ctx.arc(6,-13,10,0,7); ctx.fill();                // head
  ctx.beginPath(); ctx.ellipse(3,-27,3.4,10,-0.15,0,7); ctx.ellipse(10,-27,3.4,10,0.15,0,7); ctx.fill();  // ears
  ctx.fillStyle='#ffd0dd'; ctx.beginPath(); ctx.ellipse(3,-27,1.5,6,-0.15,0,7); ctx.ellipse(10,-27,1.5,6,0.15,0,7); ctx.fill();

  ctx.fillStyle='#ff8aa8'; ctx.beginPath(); ctx.arc(8,-10,1.8,0,7); ctx.fill();                            // nose
  ctx.restore();
}
function drawHeartsWorld(){
  sparkles.forEach(s => {
    if (s.kind !== 'heart') return;
    const a = Math.max(0, s.life/s.max), r = 5;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(s.x, s.y); ctx.fillStyle = '#ff6b9d';
    ctx.beginPath();
    ctx.moveTo(0, r*0.9);
    ctx.bezierCurveTo(r*1.3, -r*0.4, r*0.5, -r*1.3, 0, -r*0.4);
    ctx.bezierCurveTo(-r*0.5, -r*1.3, -r*1.3, -r*0.4, 0, r*0.9);
    ctx.fill(); ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function shadowAt(x,y,w){ ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(x,y,w,w*0.3,0,0,7); ctx.fill(); }
function labelAt(x,y,text){ ctx.font='bold 22px "Comic Sans MS",sans-serif'; ctx.textAlign='center'; const w=ctx.measureText(text).width+24; ctx.fillStyle='rgba(255,255,255,0.92)'; roundRect(x-w/2,y-30,w,30,15); ctx.fill(); ctx.fillStyle='#1c3b57'; ctx.fillText(text,x,y-8); }
// Draw centered text, shrinking the font so a long name still fits maxW.
function fitText(text, x, y, maxW, size){ let fs=size; ctx.font='bold '+fs+'px "Comic Sans MS",sans-serif'; while(fs>20 && ctx.measureText(text).width>maxW){ fs-=2; ctx.font='bold '+fs+'px "Comic Sans MS",sans-serif'; } ctx.fillText(text,x,y); }

function drawCharacter(kind, x, feetY, bob, inAir) {
  const b = Math.sin(bob)*4;
  const S = settings.bigChar ? 1.28 : 1;
  shadowAt(x, GROUND+2, (40 - Math.min(30, (GROUND-feetY)*0.12)) * S);
  ctx.save();
  ctx.translate(x, feetY - FOOT + b);
  ctx.save(); ctx.scale(player.dir, 1);
  if (S !== 1) { ctx.translate(0, FOOT); ctx.scale(S, S); ctx.translate(0, -FOOT); }   // grow, feet planted
  if (kind==='anna') drawAnna(inAir); else if (kind==='elsa') drawElsa(inAir);
  else if (kind==='kristoff') drawKristoff(inAir); else drawSven(inAir);
  drawHat(playHat, kind);
  ctx.restore();
  ctx.restore();
  labelAt(x, feetY - FOOT - 2 - (S-1)*FOOT, areaWho());
}

function drawSnowman(x, y, wave, parts2) {
  ctx.save(); ctx.translate(x,y);
  shadowAt(0,42,30);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,24,26,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(0,-6,20,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(0,-34,15,0,7); ctx.fill();
  ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.arc(-5,-36,2.4,0,7); ctx.arc(5,-36,2.4,0,7); ctx.fill();
  const P = parts2 || { nose:1, arm:2, buttons:1, hair:1 };
  if (P.buttons){ ctx.beginPath(); ctx.arc(-4,-4,2,0,7); ctx.arc(0,0,2,0,7); ctx.arc(4,4,2,0,7); ctx.fill(); }
  if (P.nose){ ctx.fillStyle='#ff8a1e'; ctx.beginPath(); ctx.moveTo(2,-32); ctx.lineTo(22,-30); ctx.lineTo(2,-27); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,-30,7,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
  ctx.strokeStyle='#6b4a2a'; ctx.lineWidth=3; ctx.lineCap='round';
  const wv = wave ? Math.sin(performance.now()/200)*0.5 : 0;
  if (P.arm>=1){ ctx.beginPath(); ctx.moveTo(-16,-4); ctx.lineTo(-34,-4-(wave?18:0)+wv*10); ctx.stroke(); }
  if (P.arm>=2){ ctx.beginPath(); ctx.moveTo(16,-4); ctx.lineTo(34,4); ctx.stroke(); }
  if (P.hair){ ctx.beginPath(); ctx.moveTo(-4,-48); ctx.lineTo(-8,-58); ctx.moveTo(0,-49); ctx.lineTo(0,-60); ctx.moveTo(4,-48); ctx.lineTo(8,-58); ctx.stroke(); }
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle='rgba(28,59,87,0.28)'; roundRect(20,16,330,64,18); ctx.fill();
  if (story.id === 'olaf') {
    ctx.font='bold 18px "Comic Sans MS",sans-serif'; ctx.textAlign='left'; ctx.fillStyle='#fff';
    ctx.fillText("Build Olaf:", 36, 40);
    ctx.fillText(collected + " / " + totalItems, 40, 66);
    ctx.save(); ctx.translate(150, 66); ctx.scale(0.62,0.62); drawSnowman(0,-30,false,{ nose:parts.nose, arm:parts.arm||0, buttons:parts.buttons, hair:parts.hair }); ctx.restore();
  } else {
    // carrots & snowgies: a row of pips that fill as you collect
    const label = story.id === 'carrots' ? "Sven's carrots:" : "Snowgies:";
    ctx.font='bold 20px "Comic Sans MS",sans-serif'; ctx.textAlign='left'; ctx.fillStyle='#fff';
    ctx.fillText(label, 36, 54);
    const startPip = 40 + ctx.measureText(label).width + 16;
    for (let i=0;i<totalItems;i++){
      const cx = startPip + i*24, cy = 46, on = i < collected;
      ctx.save(); ctx.translate(cx, cy);
      if (story.id === 'carrots') {
        ctx.rotate(0.2); ctx.globalAlpha = on?1:0.3;
        ctx.fillStyle = on?'#ff8a1e':'#fff'; ctx.beginPath(); ctx.moveTo(-7,-9); ctx.lineTo(7,-9); ctx.lineTo(0,13); ctx.closePath(); ctx.fill();
        ctx.fillStyle = on?'#3fa35a':'#fff'; ctx.beginPath(); ctx.ellipse(0,-11,3,6,0,0,7); ctx.fill();
      } else {
        ctx.globalAlpha = on?1:0.35;
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill();
        if (on){ ctx.fillStyle='#20323f'; ctx.beginPath(); ctx.arc(-3,-1,1.4,0,7); ctx.arc(3,-1,1.4,0,7); ctx.fill(); ctx.fillStyle='#ff8a1e'; ctx.beginPath(); ctx.moveTo(0,1); ctx.lineTo(5,2); ctx.lineTo(0,3); ctx.closePath(); ctx.fill(); }
      }
      ctx.restore(); ctx.globalAlpha=1;
    }
  }
  // area title
  ctx.textAlign='center'; ctx.fillStyle='rgba(28,59,87,0.30)';
  ctx.font='bold 24px "Comic Sans MS",sans-serif'; const t=area.title, w=ctx.measureText(t).width+40;
  roundRect(W/2-w/2,16,w,42,16); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillText(t,W/2,45);
  // room progress dots (which room you're in)
  const n = story.areas.length, dotGap = 22, dx = W/2 - (n-1)*dotGap/2, dy = 72;
  for (let i=0;i<n;i++){
    ctx.beginPath(); ctx.arc(dx + i*dotGap, dy, i===areaIndex?7:5, 0, 7);
    ctx.fillStyle = i < areaIndex ? '#8affc1' : (i === areaIndex ? '#fff' : 'rgba(255,255,255,0.45)');
    ctx.fill();
  }
  // controls hint
  ctx.font='bold 16px "Comic Sans MS",sans-serif'; ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.textAlign='right';
  ctx.fillText('←  →  move    ↑  jump', W-80, 40);
  // golden stars found this play
  if (goldRun > 0) { ctx.textAlign='right'; ctx.font='bold 18px "Comic Sans MS",sans-serif'; ctx.fillStyle='#ffd23f'; ctx.fillText('🌟 ' + goldRun, W-80, 66); }
}
function drawSwitchBanner() {
  ctx.fillStyle='rgba(28,59,87,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(W/2,H/2+30); ctx.scale(1.7,1.7);
  drawCharByKey(areaDraw()); drawHat(playHat, areaDraw());
  ctx.restore();
  ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 40px "Comic Sans MS",sans-serif';
  const heading = (playChar === 'everyone') ? ('Now you are ' + areaWho() + '!') : area.title;
  fitText(heading, W/2, H/2-90, 820, 40);
  ctx.font='bold 22px "Comic Sans MS",sans-serif';
  ctx.fillText('←  →  walk      ↑  jump', W/2, H/2+160);
}
function drawCharByKey(k){

  else if (k==='kristoff') drawKristoff(false); else drawSven(false);

function pulseAlpha(){ return RM() ? 0.9 : 0.6 + 0.4*Math.abs(Math.sin(performance.now()/500)); }

function drawMenu() {
  ctx.fillStyle=skyGrad('#5b8fd6','#bfe3ff'); ctx.fillRect(0,0,W,H); snow();
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.92)'; roundRect(W/2-330,40,660,84,24); ctx.fill();
  ctx.fillStyle='#2b6cb0';
  fitText('❄️ ' + NAME + "'s Frozen Games ❄️", W/2, 96, 610, 42);

  const n=STORIES.length, gap = n>=3 ? 22 : 40;
  const cardW = Math.min(360, Math.floor((W-60 - gap*(n-1))/n)), cardH=236, cy=182;
  const totalW=cardW*n+gap*(n-1), startX=(W-totalW)/2;
  menuHits = [];
  STORIES.forEach((s,i)=>{
    const x=startX+i*(cardW+gap), sel=i===menuIndex;
    menuHits.push({ i, x, y: cy, w: cardW, h: cardH });
    ctx.fillStyle = sel ? '#ffffff' : 'rgba(255,255,255,0.72)';
    if (sel){ ctx.strokeStyle='#ff3b6b'; ctx.lineWidth=6; }
    roundRect(x,cy,cardW,cardH,24); ctx.fill(); if(sel) ctx.stroke();
    // illustration
    ctx.save(); ctx.translate(x+cardW/2, cy+118);
    if (s.id==='carrots'){ ctx.scale(1.3,1.3); drawSven(false); }
    else if (s.id==='snowgies'){ ctx.scale(1.9,1.9); drawSnowgie(0,-6); }
    else { drawSnowman(0,-16,true); }
    ctx.restore();
    ctx.fillStyle='#2b6cb0';
    fitText(s.emoji + ' ' + s.title, x+cardW/2, cy+cardH-44, cardW-16, 24);
    ctx.fillStyle='#1c3b57'; ctx.font='bold 14px "Comic Sans MS",sans-serif';
    ctx.fillText(s.sub, x+cardW/2, cy+cardH-18);
  });

  ctx.fillStyle='#fff'; ctx.font='bold 22px "Comic Sans MS",sans-serif';
  ctx.fillText('←  →  choose  (or tap)', W/2, cy+cardH+42);
  ctx.fillStyle='rgba(255,59,107,'+pulseAlpha()+')'; roundRect(W/2-170,cy+cardH+58,340,54,20); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 26px "Comic Sans MS",sans-serif';
  ctx.fillText('Press  ↑  to Play', W/2, cy+cardH+94);
}

// ---- Choose-your-character (+ dress-up hats) ------------------------------
function drawChoose() {
  ctx.fillStyle=skyGrad('#7bb0e6','#dff1ff'); ctx.fillRect(0,0,W,H); snow();
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.92)'; roundRect(W/2-320,26,640,60,20); ctx.fill();
  ctx.fillStyle='#2b6cb0'; fitText('Who do you want to be, ' + NAME + '?', W/2, 68, 600, 32);

  const n=CHARS.length, gap=16;
  const cardW=Math.floor((W-90 - gap*(n-1))/n), cardH=184, cy=104;
  const totalW=cardW*n+gap*(n-1), startX=(W-totalW)/2;
  chooseHits = [];
  CHARS.forEach((c,i)=>{
    const x=startX+i*(cardW+gap), sel=i===charIndex;
    chooseHits.push({ i, x, y: cy, w: cardW, h: cardH });
    ctx.fillStyle = sel ? '#fff' : 'rgba(255,255,255,0.75)';
    if (sel){ ctx.strokeStyle='#ff3b6b'; ctx.lineWidth=6; }
    roundRect(x,cy,cardW,cardH,20); ctx.fill(); if(sel) ctx.stroke();
    ctx.save(); ctx.translate(x+cardW/2, cy+cardH-48); ctx.scale(0.9,0.9);
    if (c.key==='everyone'){ ctx.font='58px sans-serif'; ctx.textAlign='center'; ctx.fillText('⭐', 0, -14); }
    else { drawCharByKey(c.key); drawHat(HATS[hatIndex].key, c.key); }   // preview the hat
    ctx.restore();
    ctx.fillStyle='#2b6cb0'; fitText(c.name, x+cardW/2, cy+cardH-12, cardW-10, 20);
  });

  // hat picker row
  const hy = cy + cardH + 26;
  ctx.fillStyle='#2b6cb0'; ctx.font='bold 20px "Comic Sans MS",sans-serif'; ctx.textAlign='center';
  ctx.fillText('👒 Pick a hat', W/2, hy - 18);
  const hn=HATS.length, hgap=10, chip=46;
  const hTotal=hn*chip+(hn-1)*hgap, hStart=(W-hTotal)/2;
  hatHits = [];
  HATS.forEach((h,i)=>{
    const x=hStart+i*(chip+hgap), sel=i===hatIndex;
    hatHits.push({ i, x, y: hy, w: chip, h: chip });
    ctx.fillStyle = sel ? '#fff' : 'rgba(255,255,255,0.72)';
    if (sel){ ctx.strokeStyle='#ff3b6b'; ctx.lineWidth=4; }
    roundRect(x, hy, chip, chip, 12); ctx.fill(); if (sel) ctx.stroke();
    ctx.save(); ctx.translate(x+chip/2, hy+chip/2+6); ctx.scale(0.9,0.9);
    ctx.fillStyle='#ffe6d0'; ctx.beginPath(); ctx.arc(0,0,10,0,7); ctx.fill();   // little head
    drawHatShape(h.key);
    ctx.restore();
  });

  ctx.fillStyle='#fff'; ctx.font='bold 18px "Comic Sans MS",sans-serif';
  ctx.fillText('←  →  hero    ↓  hat    (or tap)', W/2, hy + chip + 30);
  ctx.fillStyle='rgba(255,59,107,'+pulseAlpha()+')'; roundRect(W/2-160, hy+chip+42, 320, 46, 18); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px "Comic Sans MS",sans-serif';
  ctx.fillText('Press  ↑  to Start', W/2, hy + chip + 73);
}

// ---- Win -----------------------------------------------------------------
function drawWin() {
  ctx.fillStyle=skyGrad('#ffd6ec','#dff3ff'); ctx.fillRect(0,0,W,H);
  confetti.forEach(p=>{ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); });
  if (story.id==='olaf') { ctx.save(); ctx.translate(W/2,380); ctx.scale(2.4,2.4); drawSnowman(0,0,true); ctx.restore(); }
  else if (story.id==='snowgies') { for(let i=0;i<3;i++){ ctx.save(); ctx.translate(W/2-140+i*140, 400+Math.sin(performance.now()/300+i)*8); ctx.scale(2.4,2.4); drawSnowgie(0,0); ctx.restore(); } }
  else { ctx.save(); ctx.translate(W/2,410); ctx.scale(1.8,1.8); drawSven(false); drawHat(playHat,'sven'); ctx.restore(); for(let i=0;i<6;i++){ ctx.save(); ctx.translate(W/2-100+i*40, 500+Math.sin(performance.now()/400+i)*3); ctx.rotate(0.2); ctx.fillStyle='#ff8a1e'; ctx.beginPath(); ctx.moveTo(-9,-13); ctx.lineTo(9,-13); ctx.lineTo(0,16); ctx.closePath(); ctx.fill(); ctx.fillStyle='#3fa35a'; ctx.beginPath(); ctx.ellipse(0,-15,4,8,0,0,7); ctx.fill(); ctx.restore(); } }
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.92)'; roundRect(W/2-340,64,680,150,28); ctx.fill();
  ctx.fillStyle='#e0710f'; fitText('⭐ Great job, ' + NAME + '! ⭐', W/2, 120, 630, 48);
  ctx.fillStyle='#2b6cb0'; ctx.font='bold 26px "Comic Sans MS",sans-serif'; ctx.fillText(story.winTitle, W/2, 160);
  ctx.fillStyle='#1c3b57'; ctx.font='bold 22px "Comic Sans MS",sans-serif'; ctx.fillText(story.winLine, W/2, 195);
  if (goldRun > 0) {
    ctx.fillStyle='#b8860b'; ctx.font='bold 22px "Comic Sans MS",sans-serif';
    ctx.fillText('🌟 ' + goldRun + ' golden star' + (goldRun>1?'s':'') + '!   (⭐ ' + starTotal + ' in all)', W/2, 250);
  }
  ctx.fillStyle='rgba(63,163,90,'+pulseAlpha()+')'; roundRect(W/2-200,528,400,56,20); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px "Comic Sans MS",sans-serif'; ctx.fillText('Press  ↑  for the menu', W/2, 564);
}

// =========================================================================
//  ENGAGEMENT EXTRAS — sounds, hats, buddy, surprises, world skins
// =========================================================================
function sfxPop()   { tone(700,0,0.05,'triangle',0.14); tone(1000,0.03,0.06,'sine',0.10); }
function sfxBoing() { tone(200,0,0.12,'sine',0.18); tone(520,0.06,0.14,'sine',0.14); }
function sfxGold()  { [784,988,1319,1568].forEach((f,i)=>tone(f,i*0.09,0.24,'sine',0.22)); }
const COMBO_NOTES = [523,587,659,698,784,880,988,1047,1175,1319,1397];
function sfxCombo(n){ const f = COMBO_NOTES[Math.min(Math.max(n,0), COMBO_NOTES.length-1)]; tone(f, 0, 0.16, 'sine', 0.16); }

// ---- Hats (dress-up) -----------------------------------------------------
const HATS = [
  { key:'none',   name:'None'   },
  { key:'crown',  name:'Crown'  },
  { key:'party',  name:'Party'  },
  { key:'beanie', name:'Beanie' },
  { key:'bow',    name:'Bow'    },
  { key:'flower', name:'Flower' },
];
function hatOffset(kind){ return kind==='sven' ? { x:6, y:-46 } : { x:0, y:-58 }; }
function drawHat(key, kind){ if (!key || key==='none') return; const o=hatOffset(kind); ctx.save(); ctx.translate(o.x, o.y); drawHatShape(key); ctx.restore(); }
function drawHatShape(key){
  if (!key || key==='none') return;
  if (key==='crown'){
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.moveTo(-16,4); ctx.lineTo(-16,-6); ctx.lineTo(-8,2); ctx.lineTo(0,-12); ctx.lineTo(8,2); ctx.lineTo(16,-6); ctx.lineTo(16,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ff5b8a'; ctx.beginPath(); ctx.arc(0,-1,2.4,0,7); ctx.fill();
    ctx.fillStyle='#59c1ff'; ctx.beginPath(); ctx.arc(-9,1,1.8,0,7); ctx.arc(9,1,1.8,0,7); ctx.fill();
  } else if (key==='party'){
    ctx.fillStyle='#ff5b8a'; ctx.beginPath(); ctx.moveTo(-13,6); ctx.lineTo(13,6); ctx.lineTo(0,-30); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-9,-2); ctx.lineTo(6,0); ctx.moveTo(-4,-14); ctx.lineTo(7,-12); ctx.stroke();
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(0,-32,4,0,7); ctx.fill();
  } else if (key==='beanie'){
    ctx.fillStyle='#4aa3e0'; ctx.beginPath(); ctx.arc(0,2,15,Math.PI,0); ctx.fill(); ctx.fillRect(-15,0,30,5);
    ctx.fillStyle='#cfeaff'; ctx.fillRect(-15,4,30,5);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-14,5,0,7); ctx.fill();
  } else if (key==='bow'){
    ctx.fillStyle='#ff5b8a';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-16,-8); ctx.lineTo(-16,8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(16,-8); ctx.lineTo(16,8); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#e23e6b'; ctx.beginPath(); ctx.arc(0,0,4,0,7); ctx.fill();
  } else if (key==='flower'){
    ctx.fillStyle='#ff8fb1'; for(let i=0;i<5;i++){ const a=i/5*6.283; ctx.beginPath(); ctx.arc(Math.cos(a)*7, -2+Math.sin(a)*7, 5, 0,7); ctx.fill(); }
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(0,-2,4,0,7); ctx.fill();
  }
}

// ---- The follower buddy (a little snowgie) -------------------------------
function initBuddy(){ buddy = { x: player.x - 48, hopT: 0, cheer: 0 }; }
function drawBuddy(){
  if (!buddy) return;
  const hop   = buddy.hopT  > 0 ? Math.sin((1 - buddy.hopT/0.5) * Math.PI) * 22 : 0;
  const cheer = buddy.cheer > 0 ? Math.sin((1 - buddy.cheer/0.6) * Math.PI) * 10 : 0;
  shadowAt(buddy.x, GROUND+2, 13);
  ctx.save(); ctx.translate(buddy.x, GROUND - 12 - hop - cheer); ctx.scale(0.78,0.78); drawSnowgie(0,0); ctx.restore();
}

// ---- Surprise layout + interactive objects each time a room loads --------
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function relayoutArea(a){
  const baseX = [520, 1000, 1520, 1980];
  a.platforms.forEach((p,i)=>{ p.x = baseX[i] + Math.floor(Math.random()*80 - 40); p.y = 340 + Math.floor(Math.random()*80); });
  const idx = shuffle([0,1,2,3]).slice(0, a.items.length);
  a.items.forEach((it,i)=>{ const p = a.platforms[idx[i]]; it.x = p.x + p.w/2; it.y = p.y - 50; it.got = false; it.wob = i; });
  // golden bonus star ~55% of rooms, on a spare platform
  a.bonus = null;
  if (Math.random() < 0.55){
    const rest = [0,1,2,3].filter(k => idx.indexOf(k) < 0);
    const pk = (rest.length ? rest[Math.floor(Math.random()*rest.length)] : Math.floor(Math.random()*4));
    const p = a.platforms[pk]; a.bonus = { x: p.x + p.w/2, y: p.y - 52, got: false, wob: 0 };
  }
  a.friend.x = 300 + Math.floor(Math.random()*180);
  a.bounce  = { x: 720 + Math.floor(Math.random()*120), t: 0 };
  a.pokes   = [ { x: 1160 + Math.floor(Math.random()*120), rev: 0, cool: 0 },
                { x: 1820 + Math.floor(Math.random()*150), rev: 0, cool: 0 } ];
  a.bubbles = []; a.bubbleT = 1;
}
function popBubble(b){ sfxPop(); const n = RM()?4:8; for (let i=0;i<n;i++){ const a=Math.random()*7, sp=40+Math.random()*90; sparkles.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.6,max:0.6,kind:'puff',r:3+Math.random()*3}); } }
function revealPoke(pk){ pk.rev = 1.4; pk.cool = 2.4; sfxHi(); const n = RM()?4:9; for (let i=0;i<n;i++){ const a=-Math.PI/2 + (Math.random()-0.5)*1.3, sp=50+Math.random()*90; sparkles.push({x:pk.x,y:GROUND-28,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.7,max:0.7,kind:'puff',r:3+Math.random()*3}); } if (Math.random()<0.5) say("Boo!"); }

// ---- Drawing the interactive objects -------------------------------------
function drawStar(x,y,r,fill,stroke){ ctx.save(); ctx.translate(x,y); ctx.beginPath(); for (let i=0;i<5;i++){ const a=-Math.PI/2 + i*2*Math.PI/5; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); const b=a+Math.PI/5; ctx.lineTo(Math.cos(b)*r*0.45, Math.sin(b)*r*0.45); } ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke(); } ctx.restore(); }
function drawGolden(bn){ const y = bn.y + Math.sin(bn.wob)*6; glow(bn.x, y, 54, true); drawStar(bn.x, y, 18, '#ffd23f', '#ffb300'); }
function drawBounce(bp){ const sq = bp.t>0 ? Math.sin((bp.t/0.35)*Math.PI)*6 : 0; const w=56, h=16 - sq*0.4; ctx.strokeStyle='#c76a8a'; ctx.lineWidth=3; for (let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(bp.x+i*15, GROUND); ctx.lineTo(bp.x+i*15, GROUND-h+sq+4); ctx.stroke(); } ctx.fillStyle='#ff8fb1'; roundRect(bp.x-w/2, GROUND-h+sq, w, h, 8); ctx.fill(); ctx.fillStyle='#ffd0dd'; roundRect(bp.x-w/2, GROUND-h+sq, w, 6, 6); ctx.fill(); }
function drawMound(pk){
  ctx.fillStyle='#eaf4ff'; ctx.beginPath(); ctx.ellipse(pk.x, GROUND+2, 36, 20, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(pk.x-8, GROUND-4, 12, 6, -0.4, Math.PI, 0); ctx.fill();
  if (pk.rev > 0){ const frac = pk.rev/1.4, rise = Math.sin(Math.min(1,frac)*Math.PI); drawSnowgie(pk.x, GROUND - 10 - rise*30); }
}
function drawBubble(b){ const x = b.x + Math.sin(b.wob)*6; ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2; ctx.fillStyle='rgba(200,235,255,0.30)'; ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(x - b.r*0.35, b.y - b.r*0.35, b.r*0.18, 0, 7); ctx.fill(); ctx.restore(); }
function drawPuffWorld(){ sparkles.forEach(s => { if (s.kind!=='puff') return; const a=Math.max(0,s.life/s.max); ctx.globalAlpha=a; ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(s.x, s.y, (s.r||4), 0, 7); ctx.fill(); }); ctx.globalAlpha=1; }

// ---- World that changes: day / sunset / night skins ----------------------
let nightStars = null;
function ensureStars(){ if (nightStars) return; nightStars=[]; for (let i=0;i<40;i++) nightStars.push({ x:Math.random()*W, y:Math.random()*GROUND*0.72, r:0.6+Math.random()*1.6, p:Math.random()*7 }); }
function drawAurora(){ const t=performance.now()/1000; const cols=['rgba(120,255,190,0.10)','rgba(150,180,255,0.10)','rgba(200,150,255,0.10)']; for (let bnd=0;bnd<3;bnd++){ ctx.beginPath(); const baseY=64+bnd*24; for (let x=0;x<=W;x+=20){ const y=baseY+Math.sin(x/120 + t*0.6 + bnd)*16; if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.lineTo(W, baseY+64); ctx.lineTo(0, baseY+64); ctx.closePath(); ctx.fillStyle=cols[bnd]; ctx.fill(); } }
function skyOverlay(){
  if (timeOfDay==='sunset'){
    const g=ctx.createLinearGradient(0,0,0,GROUND); g.addColorStop(0,'rgba(255,150,90,0.32)'); g.addColorStop(1,'rgba(255,214,150,0.10)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,GROUND);
  } else if (timeOfDay==='night'){
    ctx.fillStyle='rgba(20,30,70,0.55)'; ctx.fillRect(0,0,W,GROUND);
    ensureStars(); ctx.fillStyle='#fff';
    for (const s of nightStars){ ctx.globalAlpha=0.5+0.5*Math.sin(performance.now()/500+s.p); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
    ctx.fillStyle='#f7f3d8'; ctx.beginPath(); ctx.arc(W-120,90,28,0,7); ctx.fill();
    drawAurora();
  }
}

// =========================================================================
//  MAIN LOOP
// =========================================================================
function frame(t) {
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000; lastT = t;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
